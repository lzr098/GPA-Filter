[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgra-prefilter"
version = "1.0.0"
description = "Genomic region prefilter for whole-genome VCF files based on GENCODE, ENCODE, and ClinVar"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["genomics", "vcf", "prefilter", "clinvar", "gencode", "encode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
dgra-prefilter = "dgra_prefilter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
]
build = [
    "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dgra_prefilter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
